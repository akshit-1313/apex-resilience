# Job 1 (static-analysis) runs on every event. Job 2 (scratch-org-tests) runs the Apex tests in a
# fresh scratch org, only when job 1 passes and the change needs an org.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_scratch_org:
        description: Skip the scratch-org job
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same PR cancels the older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      needs_org: ${{ steps.changes.outputs.needs_org }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node from the Volta pin
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install npm dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Check formatting
        run: npm run prettier:verify

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli@2.151.7
          sf --version

      - name: Install Code Analyzer plugin
        run: sf plugins install code-analyzer@5.16.0

      - name: Run Code Analyzer
        id: analyzer
        uses: forcedotcom/run-code-analyzer@318e7429b49b97904dc41f7acbd41003db403965 # v2.14.0
        with:
          run-arguments: --workspace . --view detail --output-file sfca_results.json

      # Fails closed: a missing output (crashed analyzer) is treated as a failure.
      - name: Fail on analyzer errors or sev1/sev2 violations
        env:
          EXIT_CODE: ${{ steps.analyzer.outputs.exit-code }}
          SEV1: ${{ steps.analyzer.outputs.num-sev1-violations }}
          SEV2: ${{ steps.analyzer.outputs.num-sev2-violations }}
        run: |
          echo "exit-code=${EXIT_CODE:-missing} sev1=${SEV1:-missing} sev2=${SEV2:-missing}"
          if [ "$EXIT_CODE" != "0" ] || [ "$SEV1" != "0" ] || [ "$SEV2" != "0" ]; then
            echo "::error::Code Analyzer did not finish cleanly or found sev1/sev2 violations."
            exit 1
          fi

      # Job 2 reads this output. Anything other than Markdown or LICENSE needs a scratch org;
      # manual runs always do, and so does any run where the diff can't be computed.
      - name: Decide whether this change needs a scratch org
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            needs_org=true
            echo "Manual run: scratch org needed."
          elif ! changed=$(git diff --name-only HEAD^1 HEAD); then
            needs_org=true
            echo "::warning::Could not compute the diff; assuming a scratch org is needed."
          else
            echo "Changed files:"
            echo "$changed"
            if grep -qvE '(\.md$|^LICENSE$)' <<< "$changed"; then
              needs_org=true
            else
              needs_org=false
            fi
          fi
          echo "needs_org=$needs_org" >> "$GITHUB_OUTPUT"
          echo "needs_org=$needs_org"

  scratch-org-tests:
    needs: static-analysis
    # Skipped (and a skipped job reports success) for docs-only changes, manual runs with
    # skip_scratch_org, Dependabot, draft PRs and fork PRs, which receive no secrets.
    if: >-
      needs.static-analysis.outputs.needs_org == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_scratch_org) &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # bash here means -eo pipefail, so a failing sf command can't hide behind a jq pipe.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from the Volta pin
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli@2.151.7
          sf --version

      # The auth URL arrives through env and a pipe, so it never touches disk or the command line.
      # The "-" matters: --sfdx-url-stdin takes a value and would otherwise swallow --alias.
      # JSON output keeps the Dev Hub username and org ID out of the public log.
      - name: Log in to the Dev Hub
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" \
            | sf org login sfdx-url --sfdx-url-stdin - --alias devhub --set-default-dev-hub --json \
            | jq -r 'if .status == 0 then "Logged in to the Dev Hub." else .message end'

      - name: Log remaining scratch-org allocation
        run: |
          sf org list limits --target-org devhub --json \
            | jq -r '.result[] | select(.name | endswith("ScratchOrgs")) | "\(.name): \(.remaining) of \(.max) left"'

      # JSON output again: the plain output links to the Dev Hub's domain, and the JSON may carry
      # an access token, so jq prints only the new org's username.
      - name: Create a scratch org
        id: create-org
        run: |
          sf org create scratch --definition-file config/project-scratch-def.json --alias ci-scratch \
            --duration-days 1 --target-dev-hub devhub --wait 10 --json \
            | jq -r 'if .status == 0 then "Created scratch org \(.result.username)" else .message end'

      - name: Deploy to the scratch org
        run: sf project deploy start --source-dir force-app --target-org ci-scratch --wait 10

      # The CLI exits with code 100 when a test fails. The failing tests are printed first so the
      # log shows them; the step then exits with the CLI's own code.
      - name: Run Apex tests
        run: |
          mkdir -p test-results
          status=0
          sf apex run test --wait 20 --code-coverage --result-format json \
            --output-dir test-results --target-org ci-scratch > test-results/result.json || status=$?
          jq -r '.result.tests[]? | select(.Outcome != "Pass") | "FAIL \(.FullName): \(.Message)"' \
            test-results/result.json || true
          exit "$status"

      # Fails closed: a false result, a missing field (for example a --wait timeout that returns
      # only a run ID) or an unreadable file all make jq exit non-zero.
      - name: Require passing tests and 90% org-wide coverage
        run: |
          jq -r '"outcome=\(.result.summary.outcome) orgWideCoverage=\(.result.summary.orgWideCoverage)"' \
            test-results/result.json
          jq -e '.result.summary.outcome == "Passed" and ((.result.summary.orgWideCoverage | rtrimstr("%") | tonumber) >= 90)' \
            test-results/result.json

      # !cancelled() still uploads after a failure, when the results matter most.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apex-test-results
          path: test-results/

      # always() also runs when a newer push cancels this run, so cancelling can't leak an org.
      # It's skipped only when no org was ever requested, for example because the login failed.
      - name: Delete the scratch org
        if: ${{ always() && steps.create-org.outcome != 'skipped' }}
        run: sf org delete scratch --target-org ci-scratch --no-prompt
